<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141815" />
      <stop offset="100%" stop-color="#0B0E0C" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4EB9C" />
      <stop offset="50%" stop-color="#D2F865" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D5128" />
      <stop offset="100%" stop-color="#141815" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(210, 248, 101, 0.2)" stroke-width="2" />

  <!-- Subtle Radial Glow -->
  <circle cx="256" cy="230" r="140" fill="#2D5128" opacity="0.35" filter="url(#glow)" />

  <!-- Geometric Modern Fiscal Icon: TributoVE Geometric Mark -->
  <g transform="translate(106, 110)">
    <!-- Brand 3 Dots in Header -->
    <circle cx="50" cy="40" r="14" fill="#D2F865" />
    <circle cx="95" cy="40" r="14" fill="#22C55E" />
    <circle cx="140" cy="40" r="14" fill="#2D5128" />

    <!-- Fiscal Chart / Chevron T Shape -->
    <!-- Left Pillar -->
    <rect x="36" y="90" width="46" height="170" rx="14" fill="url(#limeGrad)" />
    <!-- Center Elevated Pillar -->
    <rect x="102" y="140" width="46" height="120" rx="14" fill="#22C55E" />
    <!-- Right Pillar / Arrow Up -->
    <rect x="168" y="70" width="46" height="190" rx="14" fill="url(#limeGrad)" />
    <!-- Crossbar Bridge -->
    <path d="M 36 120 Q 125 150 214 90" fill="none" stroke="#D2F865" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
    
    <!-- Dynamic Target Accent -->
    <circle cx="236" cy="50" r="10" fill="#D2F865" filter="url(#glow)" />
  </g>
</svg>