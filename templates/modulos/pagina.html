{% extends 'layouts/app.html' %}

{% block title %}{{ modulo.nombre }} · TributoVE{% endblock %}

{% block content %}
<div class="d-flex flex-column w-100 flex-grow-1" style="min-height: 0;">
  <!-- Contenedor con estado de carga animado y transición suave del módulo -->
  <div class="modulo-stage w-100 p-0 m-0 flex-grow-1 d-flex flex-column" style="background-color: var(--tv-bg); min-height: 0; position: relative;">
    <div id="moduloLoaderOverlay" class="modulo-loader-overlay" aria-live="polite">
      <div class="tv-loader-banner">
        <span class="tv-btn-spinner" style="color: var(--tv-primary);"></span>
        <span>Cargando {{ modulo.nombre }}…</span>
      </div>
      <div class="d-flex gap-2">
        <div class="tv-skeleton-box" style="height: 32px; width: 110px;"></div>
        <div class="tv-skeleton-box" style="height: 32px; width: 110px;"></div>
        <div class="tv-skeleton-box" style="height: 32px; width: 110px;"></div>
      </div>
      <div class="row g-3">
        <div class="col-md-4"><div class="tv-skeleton-box" style="height: 92px;"></div></div>
        <div class="col-md-4"><div class="tv-skeleton-box" style="height: 92px;"></div></div>
        <div class="col-md-4"><div class="tv-skeleton-box" style="height: 92px;"></div></div>
      </div>
      <div class="tv-skeleton-box" style="height: 260px;"></div>
    </div>

    <iframe
      src="{{ url_calculadora }}"
      id="moduloFrame"
      title="{{ modulo.nombre }}"
      allow="clipboard-write"
      allowtransparency="true"
      style="width: 100%; height: 100%; flex: 1 1 auto; min-height: 0; border: 0; background-color: var(--tv-bg); display: block; opacity: 0; transition: opacity 0.22s ease;">
    </iframe>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  window.TV_URL_ESTADO = "{{ url_estado }}";
  window.TV_CSRF = "{{ csrf_token }}";
</script>
{% endblock %}
