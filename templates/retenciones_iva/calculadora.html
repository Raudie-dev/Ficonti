  for (var k in datosServidor) {
    if (Object.prototype.hasOwnProperty.call(datosServidor, k)) {
      try { localStorage.setItem(prefix + k, datosServidor[k]); } catch(e){}
    }
  }
  var origSet = Storage.prototype.setItem;
  var origRemove = Storage.prototype.removeItem;
  var saveQueue = {};
  var saveTimer = null;

  function syncToServer() {
    var payload = Object.assign({}, saveQueue);
    saveQueue = {};
    if (!window.EMPRESA || !window.EMPRESA.id) return;
    fetch("{{ tv_config.urlDatos }}", {
      method: "POST",

      body: JSON.stringify({ cambios: payload })

  }

  Storage.prototype.setItem = function(key, val) {
    origSet.call(this, key, val);
    if (key && key.indexOf(prefix) === 0) {
      var kSin = key.slice(prefix.length);
      saveQueue[kSin] = val;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(syncToServer, 600);
    }
  };

  Storage.prototype.removeItem = function(key) {
    origRemove.call(this, key);
    if (key && key.indexOf(prefix) === 0) {
      var kSin = key.slice(prefix.length);
      saveQueue[kSin] = null;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(syncToServer, 600);
    }
  };
})();
</script>

<body><header><h1>Retenciones de IVA · Venezuela</h1><small>Calculadora · Libro de retenciones · Quincenas · Retenciones recibidas</small></header><nav id="nv"></nav><main id="v"></main>
<script>const KEY='ivaret1',EM=window.EMPRESA||{nombre:'',rif:'',condicion:''};
const $=s=>document.querySelector(s),N=v=>parseFloat(v)||0,R=v=>Math.round((v+Number.EPSILON)*100)/100,F=v=>R(v).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),D=d=>d?d.split('-').reverse().join('/'):'';
const OP={normal:'Compra de bienes o servicios gravados',metal:'Compra de metales y piedras preciosas',exento:'Operación no sujeta, exenta o exonerada',via:'Viáticos de empleados',cch:'Gasto reembolsable o caja chica',spub:'Luz, agua, aseo o teléfono por domiciliación'};
const PT={ord:'Contribuyente ordinario',formal:'Contribuyente formal',p100:'Portal Fiscal: sujeto a retención 100 %',srif:'Proveedor sin RIF',excl:'Exportador / excluido del listado',ente:'Órgano o ente público especial'};
const COND={spe:'Sujeto pasivo especial (agente de retención)',no:'No es sujeto pasivo especial',metal:'Comprador habitual de metales y piedras preciosas'};
const blank=()=>({cfg:{emp:EM.nombre,rif:EM.rif,ut:43,elab:'',cond:EM.condicion==='Sujeto pasivo especial'?'spe':'no'},c:{base:1000,ali:16,disc:'si',req:'si',pt:'ord',op:'normal'},libro:[],rec:{ex0:0,rows:[{m:'',deb:0,cre:0,ret:0}]}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.cfg)S=blank();S.cfg.emp=EM.nombre;S.cfg.rif=EM.rif;
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let tab='cfg';
const NV=[['cfg','Datos'],['cal','Calculadora'],['lib','Libro de retenciones'],['qui','Quincenas'],['rec','Retenciones recibidas'],['gui','Guía y normas']];
function agente(op){return S.cfg.cond==='spe'||S.cfg.cond==='metal'&&op==='metal'||op==='metal'}
function rule(o){
 const ut=MON.utEf(N(S.cfg.ut)),base=N(o.base),ali=N(o.ali)/100;
 if(!agente(o.op))return{p:0,art:'Arts. 1 y 2',why:'La empresa no es sujeto pasivo especial: no actúa como agente de retención.'};
 if(o.op==='exento'||ali===0)return{p:0,art:'Art. 3, num. 1',why:'Operación no sujeta, exenta o exonerada: no se retiene.'};
 if(o.pt==='formal')return{p:0,art:'Art. 3, num. 2',why:'El proveedor es contribuyente formal: no se retiene.'};
 if(o.op==='via')return{p:0,art:'Art. 3, num. 5 a 7',why:'Viáticos de empleados: no se retiene.'};
 if(o.op==='cch'&&base<=20*ut)return{p:0,art:'Art. 3, num. 5 a 7',why:'Caja chica o gasto reembolsable de hasta 20 UT (Bs '+F(20*ut)+'): no se retiene.'};
 if(o.op==='spub')return{p:0,art:'Art. 3, num. 8',why:'Servicio público pagado por domiciliación bancaria: no se retiene.'};
 if(o.pt==='excl')return{p:0,art:'Art. 3, num. 9 y 10',why:'Proveedor exportador o excluido en el Portal Fiscal: no se retiene.'};
 if(o.pt==='ente')return{p:0,art:'Art. 3, num. 11 y 12',why:'Órgano o ente público calificado como especial: no se retiene bajo esta providencia.'};
 if(o.op==='metal')return{p:100,art:'Art. 5, num. 4',why:'Compra de metales y piedras preciosas: retención del 100 %.'};
 if(o.disc==='no')return{p:100,art:'Art. 5, num. 1',why:'El IVA no está discriminado en la factura: retención del 100 % sobre el precio facturado.'};
 if(o.req==='no')return{p:100,art:'Art. 5, num. 2',why:'La factura no cumple los requisitos legales: retención del 100 %.'};
 if(o.pt==='p100'||o.pt==='srif')return{p:100,art:'Art. 5, num. 3',why:'Proveedor con retención del 100 % en el Portal Fiscal o sin RIF: retención del 100 %.'};
 return{p:75,art:'Art. 4',why:'Regla general: se retiene el 75 % del impuesto causado.'}}
function calc(o){const r=rule(o),base=N(o.base),iva=R(base*N(o.ali)/100),ret=R(iva*r.p/100);return Object.assign({},r,{base,iva,ret,pag:R(base+iva-ret)})}
const opt=(m,v)=>Object.keys(m).map(k=>`<option value="${k}"${k==v?' selected':''}>${m[k]}</option>`).join('');
function C(k,v){S.cfg[k]=v;sv();draw()}
function K(k,v){S.c[k]=v;sv();draw()}
function L(i,k,v){S.libro[i][k]=v;sv();draw()}
function addL(){S.libro.push({f:new Date().toISOString().slice(0,10),prov:'',rif:'',fac:'',ctl:'',base:0,ali:16,disc:'si',req:'si',pt:'ord',op:'normal',comp:''});sv();draw()}
function delL(i){S.libro.splice(i,1);sv();draw()}
function numerar(){const cnt={};S.libro.map((r,i)=>[r,i]).sort((a,b)=>(a[0].f||'').localeCompare(b[0].f||'')||a[1]-b[1]).forEach(([r])=>{if(!r.f)return;const k=r.f.slice(0,7);cnt[k]=(cnt[k]||0)+1;if(calc(r).p>0&&!r.comp)r.comp=r.f.slice(0,4)+r.f.slice(5,7)+String(cnt[k]).padStart(8,'0')});sv();draw()}
function Rc(i,k,v){S.rec.rows[i][k]=v;sv();draw()}
function RX(v){S.rec.ex0=N(v);sv();draw()}
function addR(){S.rec.rows.push({m:'',deb:0,cre:0,ret:0});sv();draw()}
function delR(i){S.rec.rows.splice(i,1);if(!S.rec.rows.length)addR();else{sv();draw()}}
const fl=(l,h)=>`<label>${l}${h}</label>`;
const V={
cfg(){const c=S.cfg;return`<div class=card><h2>Datos del agente de retención</h2><div class=f>
${fl('Razón social',`<input value="${E(c.emp)}" readonly>`)}${fl('RIF',`<input value="${E(c.rif)}" readonly>`)}
${fl('Condición frente a la retención',`<select onchange="C('cond',this.value)">${opt(COND,c.cond)}</select>`)}
${fl('Unidad Tributaria (Bs\u200b, se convierte con la tasa)',`<input type=number step=any value="${c.ut}" onchange="C('ut',N(this.value))">`)}
${fl('Elaborado por',`<input value="${E(c.elab)}" onchange="C('elab',this.value)">`)}</div>
<p style="margin:10px 0 0">${agente('normal')?'<span class="tg ok">Actúa como agente de retención</span>':'<span class="tg wr">No es agente de retención (salvo compras de metales y piedras preciosas)</span>'}</p></div>
<div class=card><h2>Cómo usar este módulo</h2><p>1) Revise los datos. 2) Use la <b>Calculadora</b> para una operación puntual. 3) Registre las compras en el <b>Libro de retenciones</b>: el módulo aplica la regla y totaliza por quincena. 4) Si usted es el proveedor al que le retienen, use <b>Retenciones recibidas</b>. La base legal es la Providencia SNAT/2025/000054 (ver <i>Guía y normas</i>).</p></div>`},
cal(){const c=S.c,r=calc(c);return`<div class=card><h2>Calculadora de retención de IVA</h2><div class=f>
${fl('Base imponible (Bs)',`<input type=number step=any value="${c.base}" onchange="K('base',N(this.value))">`)}
${fl('Alícuota del IVA (%)',`<select onchange="K('ali',N(this.value))">${[[16,'16 % general'],[8,'8 % reducida'],[31,'31 % (16 % + 15 %)'],[0,'0 % exenta']].map(a=>`<option value="${a[0]}"${a[0]==c.ali?' selected':''}>${a[1]}</option>`).join('')}</select>`)}
${fl('Operación',`<select onchange="K('op',this.value)">${opt(OP,c.op)}</select>`)}
${fl('Proveedor',`<select onchange="K('pt',this.value)">${opt(PT,c.pt)}</select>`)}
${fl('¿IVA discriminado en la factura?',`<select onchange="K('disc',this.value)"><option value=si${c.disc=='si'?' selected':''}>Sí</option><option value=no${c.disc=='no'?' selected':''}>No</option></select>`)}
