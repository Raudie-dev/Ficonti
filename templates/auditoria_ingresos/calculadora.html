  for (var k in datosServidor) {
    if (Object.prototype.hasOwnProperty.call(datosServidor, k)) {
      try { localStorage.setItem(prefix + k, datosServidor[k]); } catch(e){}
    }
  }
  var origSet = Storage.prototype.setItem;
  var origRemove = Storage.prototype.removeItem;
  var saveQueue = {};
  var saveTimer = null;

  function syncToServer() {
    var payload = Object.assign({}, saveQueue);
    saveQueue = {};

      body: JSON.stringify({ cambios: payload })
    }).catch(function(err){ console.warn("Error sincronizando módulo:", err); });
  }

  Storage.prototype.setItem = function(key, val) {
    origSet.call(this, key, val);
    if (key && key.indexOf(prefix) === 0) {
      var kSin = key.slice(prefix.length);
      saveQueue[kSin] = val;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(syncToServer, 600);
    }
  };

    origRemove.call(this, key);
    if (key && key.indexOf(prefix) === 0) {
      var kSin = key.slice(prefix.length);

    }
  };
})();
</script>
