(function() {

  }

  setT(initT);

<script id="tv-bridge">
window.EMPRESA = {{ tv_config.empresa|safe }};
(function() {
  var datosServidor = {{ tv_config.datos|safe }};
  var prefix = "emp:" + (window.EMPRESA ? window.EMPRESA.id : "0") + ":";
  for (var k in datosServidor) {
    if (Object.prototype.hasOwnProperty.call(datosServidor, k)) {
      try { localStorage.setItem(prefix + k, datosServidor[k]); } catch(e){}
    }
  }
  var origSet = Storage.prototype.setItem;
  var origRemove = Storage.prototype.removeItem;
  var saveQueue = {};
  var saveTimer = null;

  function syncToServer() {
    var payload = Object.assign({}, saveQueue);
    saveQueue = {};
    if (!window.EMPRESA || !window.EMPRESA.id) return;
    fetch("{{ tv_config.urlDatos }}", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ tv_config.csrf }}"
      },
      body: JSON.stringify({ cambios: payload })
    }).catch(function(err){ console.warn("Error sincronizando módulo:", err); });
  }

  Storage.prototype.setItem = function(key, val) {
    origSet.call(this, key, val);
    if (key && key.indexOf(prefix) === 0) {
      var kSin = key.slice(prefix.length);
      saveQueue[kSin] = val;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(syncToServer, 600);
    }
  };

  Storage.prototype.removeItem = function(key) {
    origRemove.call(this, key);
    if (key && key.indexOf(prefix) === 0) {
      var kSin = key.slice(prefix.length);
      saveQueue[kSin] = null;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(syncToServer, 600);
    }
  };
})();
</script>

gui(){return`<div class="hl"><b>Guía para contadores públicos.</b> Si nunca ha calculado el impuesto diferido, siga esta guía en orden. Cada sección se abre con un clic. Los datos precargados son un ejemplo: pruebe primero con ellos y luego reemplácelos por los de su entidad.</div>
<details class="card" open><summary>1. ¿Qué es el impuesto diferido y por qué existe?</summary><p>La contabilidad (VEN-NIF) y la ley de ISLR no reconocen los ingresos y gastos en el mismo momento. Ejemplo: una provisión de cuentas incobrables reduce la utilidad contable hoy, pero el SENIAT solo la deduce cuando se cumplan sus requisitos, en el futuro. Esa diferencia de tiempo genera un impuesto que hoy no está en el balance pero que se pagará o se recuperará después.</p><ul><li><b>Impuesto por pagar</b> (corriente): sale de la declaración de renta, con reglas fiscales.</li><li><b>Gasto por ISLR</b>: sale de la contabilidad. Si ambas bases difieren, los dos montos no coinciden.</li><li><b>Impuesto diferido</b>: es el puente entre ambos. Si se pagará menos en el futuro, es un <b>pasivo</b>; si se recuperará, es un <b>activo</b>.</li></ul><p class="m">Importante: el cálculo se hace sobre la <b>diferencia acumulada</b> de cada partida al cierre (no solo la del año). El asiento registra únicamente el ajuste contra lo que ya tenga en libros.</p></details>
<details class="card"><summary>2. Los 5 pasos para calcularlo con esta app</summary><ol><li><b>Parámetros</b>: razón social, fecha de cierre, marco (GE o PYME), tarifa de impuesto con la que se realizarán las diferencias, patrimonio y destinatario del informe. Confirme la tarifa vigente en la Ley de ISLR; el 30 % precargado es solo el supuesto del libro.</li><li>En <b>Partidas</b> escriba, por cada cuenta del balance, el <b>valor en libros</b>. Si el fisco la reconoce por un monto distinto, escriba también la <b>base fiscal</b> (ver sección 4); si es igual, déjela vacía.</li><li>Si ya tiene impuesto diferido registrado en libros, use el botón <b>Más</b> de la fila e indíquelo en <i>ID activo / pasivo ya registrado</i>.</li><li>Revise <b>Resumen</b>: el estado general debe decir “OK”. Los asientos para su sistema contable están al final del <b>Informe</b>.</li><li>Prepare las notas con <b>Revelaciones</b> y entregue el <b>Informe</b> al Director de Finanzas desde <b>Compartir</b> (Gmail, WhatsApp o PDF).</li></ol></details>
<details class="card"><summary>3. Regla de oro: ¿activo o pasivo?</summary><p>Compare la <b>base financiera</b> (valor en libros) con la <b>base fiscal</b> de cada partida:</p><div class="w"><table class="gt"><thead>${th(["Si…","Y la partida es un ACTIVO","Y la partida es un PASIVO"])}</thead><tbody><tr><td>Base financiera MAYOR que base fiscal</td><td class="er">ID <b>pasivo</b></td><td class="ok">ID <b>activo</b></td></tr><tr><td>Base fiscal MAYOR que base financiera</td><td class="ok">ID <b>activo</b></td><td class="er">ID <b>pasivo</b></td></tr></tbody></table></div><p>Monto = |diferencia| × tarifa. La app lo clasifica y lo pinta en verde (activo) o rojo (pasivo) en la columna <i>Clasificación</i>.</p></details>
<details class="card"><summary>4. ¿Cómo obtengo la base fiscal? (la parte difícil)</summary><p>La base fiscal es lo que el fisco le permitirá deducir (activos) o lo que ya considera pagado (pasivos). Si la conoce, escríbala directo en Partidas. Si no, abra <b>Más</b> y use la calculadora con estas fórmulas:</p><div class="w"><table class="gt"><thead>${th(["Tipo de partida","Fórmula de base fiscal","Columnas que debe llenar","Ejemplos"])}</thead><tbody><tr><td>Activo no monetario</td><td>= Gastos deducibles futuros</td><td>Gastos deducibles</td><td>Inventarios, propiedad planta y equipo, prepagados</td></tr><tr><td>Activo monetario</td><td>= Libros − Ingresos gravables futuros + Gastos deducibles futuros</td><td>Ingresos gravables, gastos deducibles</td><td>Cuentas por cobrar, efectivo en divisas, inversiones</td></tr><tr><td>Pasivo monetario</td><td>= Libros + Ingresos gravables futuros − Gastos deducibles futuros</td><td>Ingresos gravables, gastos deducibles</td><td>Provisiones, intereses por pagar, multas (no deducibles: dejar en 0)</td></tr><tr><td>Pasivo no monetario</td><td>= Libros − Ingresos futuros no gravables</td><td>Ingresos no gravables</td><td>Ingresos cobrados por adelantado</td></tr></tbody></table></div><p><b>Monetario</b> = se cobra o paga en unidades monetarias fijas (efectivo, cuentas por cobrar y por pagar). <b>No monetario</b> = se recupera por uso o venta (inventarios, activos fijos).</p><p><b>Truco práctico:</b> pregúntese “¿cuánto podré deducir fiscalmente cuando recupere este activo?” (activos) o “¿cuánto podré deducir cuando pague este pasivo?” (pasivos). Si la respuesta es “todo lo que dice el libro”, la diferencia es cero y no hay impuesto diferido.</p><p><b>Pérdidas fiscales trasladables:</b> agréguelas como fila Activo no monetario, valor en libros 0 y gastos deducibles futuros = monto de la pérdida. <b>Rebajas por nuevas inversiones:</b> igual, con gastos deducibles = rebaja ÷ tarifa.</p></details>
<details class="card"><summary>5. Ejemplos resueltos paso a paso</summary><div class="hl"><b>Inventarios.</b> Valor en libros 15.000; el fisco permitirá deducir 22.500 (costo fiscal mayor). Activo no monetario → base fiscal = 22.500. Diferencia = 15.000 − 22.500 = −7.500. Base fiscal mayor en un activo → <b>ID activo</b> = 7.500 × 30 % = <b>2.250</b>.<br>Asiento: Dr. ID activo 2.250 / Cr. Gasto (ingreso) ISLR diferido 2.250.</div><div class="hl"><b>Propiedad, planta y equipos.</b> Libros 2.560.700 (depreciación contable acumulada 439.300); fiscalmente la depreciación acumulada es mayor y su base fiscal es 2.320.340. Diferencia = 240.360. Base financiera mayor en un activo → <b>ID pasivo</b> = 240.360 × 30 % = <b>72.108</b>.<br>Asiento: Dr. Gasto ISLR diferido 72.108 / Cr. ID pasivo 72.108.</div><div class="hl"><b>Provisión de cuentas de cobro dudoso.</b> Libros 80.000; se deducirá fiscalmente cuando se cumplan las condiciones: pasivo monetario, gastos deducibles futuros 80.000 → base fiscal 0. Diferencia 80.000, base financiera mayor en un pasivo → <b>ID activo</b> 24.000.<br>Asiento: Dr. ID activo 24.000 / Cr. Gasto ISLR diferido 24.000.</div><div class="hl"><b>Multa de 6.000 no deducible nunca.</b> Pasivo monetario, gastos deducibles futuros 0 → base fiscal 6.000 = libros. Sin diferencia, <b>no hay ID</b>.</div><p class="m">Todos estos casos ya están cargados en la pestaña Partidas: cambie un número y vea cómo se recalcula todo.</p></details>
<details class="card"><summary>6. Contrapartida del asiento: ¿Resultados, ORI o Plusvalía?</summary><ul><li><b>Resultados</b> (lo más común): cuando la partida que originó la diferencia pasó por el estado de resultados.</li><li><b>ORI / patrimonio</b>: cuando la diferencia nace de una revaluación de activos (GE), inversiones con cambios en otros resultados integrales, ajustes por conversión o coberturas de flujo de efectivo.</li><li><b>Plusvalía</b>: cuando el impuesto diferido surge al asignar valores razonables en una combinación de negocios.</li></ul><p>Elija la contrapartida en <b>Más</b> (por defecto es Resultados) y la app arma un asiento por cada una al final del Informe.</p></details>
<details class="card"><summary>7. Reglas de reconocimiento que debe cuidar</summary><ul><li><b>ID pasivo</b>: se reconoce siempre, salvo plusvalía no deducible y reconocimiento inicial sin efecto contable ni fiscal (NIC 12 párr. 15). En esos casos marque <b>“Exenta = Sí”</b>.</li><li><b>ID activo</b>: solo en la medida en que sea <b>probable</b> que existan ganancias fiscales futuras para aprovecharlo. Necesita proyecciones financieras y fiscales de la gerencia. Si solo espera recuperar una parte, use <b>% realización</b>.</li><li><b>Tarifa</b>: la que se aplicará cuando la diferencia se realice. Si una partida se realiza con otra tarifa, use la columna <b>Tarifa %</b>.</li><li><b>Presentación</b>: ID activo y pasivo en cuentas separadas y no corrientes; solo se compensan con derecho legal y misma autoridad fiscal.</li><li><b>GE vs. PYME</b>: en VEN-NIF GE el ID activo se registra neto; en PYME puede registrarse bruto con una corrección valorativa.</li></ul></details>
<details class="card"><summary>8. Sujetos pasivos especiales y el BA VEN-NIF 11</summary><p>Desde la reforma de la LISLR del 30 de diciembre de 2015, los sujetos pasivos especiales quedaron excluidos del ajuste por inflación fiscal. Contablemente los activos no monetarios se reexpresan por inflación, pero su base fiscal queda a valores históricos. Aplicar la NIC 12 al pie de la letra genera un ID pasivo enorme que puede distorsionar el patrimonio.</p><p>El <b>BA VEN-NIF 11 v1</b> (FCCPV, aprobado el 18 de abril de 2026, vigente para ejercicios desde el 1 de enero de 2017) permite como <b>política contable opcional</b> no reconocer ese ID pasivo.</p><div class="hl"><b>Cuándo aplica:</b> la entidad es sujeto pasivo especial (o su moneda funcional es de economía no hiperinflacionaria, párr. 10) y quiere omitir el ID pasivo de la diferencia imponible entre la base financiera reexpresada de activos no monetarios y su base fiscal sin inflación.</div><ul><li><b>Cómo se usa en la app:</b> en Parámetros ponga “Sí” en sujeto pasivo especial y en política BA VEN-NIF 11. En cada activo no monetario abra <b>Más</b>, marque Naturaleza = No monetario y escriba en <b>Porción por inflación</b> la parte de la diferencia que proviene de la reexpresión. La app omite el ID de esa porción y reconoce el resto de la diferencia.</li><li><b>Revelación obligatoria</b> en notas (párr. 11): monto del ID pasivo no reconocido y composición de las partidas. Está en la pestaña Revelaciones.</li><li><b>Cambio de política</b>: debe cumplir la NIC 8 o la Sección 10 (párr. 12).</li><li><b>Oportunidad</b>: si no se aplica en el primer ejercicio de vigencia (o en el primero en que se notificó la condición de sujeto pasivo especial), no puede aplicarse después (párr. 13).</li><li><b>Pérdida de condición</b>: si deja de ser sujeto pasivo especial o debe reconocer inflación fiscal, vuelve a la NIC 12 estricta (párr. 14).</li></ul></details>
<details class="card"><summary>9. Errores frecuentes</summary><ul><li>Calcular el diferido solo con el movimiento del año: debe hacerse con la diferencia <b>acumulada</b> y registrar solo el ajuste.</li><li>Olvidar anotar el ID ya registrado (columnas “previo”): el asiento saldría duplicado.</li><li>Confundir activo monetario con no monetario: cambia la fórmula de la base fiscal.</li><li>Reconocer ID activo sin soporte de ganancias fiscales futuras.</li><li>Reconocer ID pasivo sobre plusvalía no deducible.</li><li>Omitir el ID por BA VEN-NIF 11 sin la revelación en notas, o sin ser sujeto pasivo especial.</li><li>Usar una tarifa que no es la vigente al momento de realizarse la diferencia.</li></ul></details>
<details class="card"><summary>10. Glosario rápido</summary><ul><li><b>Base financiera</b>: valor en libros de la partida.</li><li><b>Base fiscal</b>: monto atribuido a la partida para efectos del impuesto.</li><li><b>Diferencia temporaria</b>: base financiera menos base fiscal.</li><li><b>ID</b>: impuesto diferido (activo o pasivo).</li><li><b>ORI</b>: otros resultados integrales (patrimonio).</li><li><b>GE / PYME</b>: VEN-NIF para grandes entidades (NIC 12) o para pequeñas y medianas (Sección 29).</li><li><b>Sujeto pasivo especial</b>: contribuyente calificado así por la administración tributaria.</li></ul><p class="m">Esta app es una herramienta de apoyo al cálculo y no sustituye el juicio profesional ni la asesoría tributaria.</p></details>
<button class="bt" data-t="par">Comenzar: ir a Parámetros</button> <button class="bt s" data-t="pt">Ver las partidas de ejemplo</button>`},
