{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TributoVE · Control Tributario Venezuela{% endblock %}</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="{% url 'core:manifest' %}">
  <meta name="theme-color" content="#1A6B4A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TributoVE">
  <meta name="application-name" content="TributoVE">

  <!-- Favicons & Touch Icons -->
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/icon.svg' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'icons/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">

  <!-- Script anti-parpadeo de tema (Claro por defecto, sin destellos neón) -->
  <script>
    (function() {
      var guardado = localStorage.getItem('tv-theme-mode') || 'light';
      localStorage.setItem('tv-theme', guardado);
      document.documentElement.setAttribute('data-bs-theme', guardado);
    })();
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- TributoVE CSS Moderno -->
  <link rel="stylesheet" href="{% static 'css/tributove.css' %}?v=3.2">

  {% block extra_css %}{% endblock %}
</head>
<body>
  {% include 'partials/toasts.html' %}

  {% block layout_content %}
    {% block content %}{% endblock %}
  {% endblock %}

  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- TributoVE Core JS -->
  <script src="{% static 'js/tributove.js' %}?v=3.2"></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
