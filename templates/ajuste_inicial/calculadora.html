<script id="tv-theme-listener">
(function() {
  function setT(t) {
    document.documentElement.className = t === 'dark' ? 'theme-dark' : 'theme-light';
    document.documentElement.setAttribute('data-theme', t);
  }
  var initT = localStorage.getItem('tv-theme') || 'dark';
  setT(initT);

  });
})();

<script id="tv-bridge">
window.EMPRESA = {{ tv_config.empresa|safe }};
(function() {
  var datosServidor = {{ tv_config.datos|safe }};
  var prefix = "emp:" + (window.EMPRESA ? window.EMPRESA.id : "0") + ":";
  for (var k in datosServidor) {
    if (Object.prototype.hasOwnProperty.call(datosServidor, k)) {
      try { localStorage.setItem(prefix + k, datosServidor[k]); } catch(e){}
    }
  }
  var origSet = Storage.prototype.setItem;
  var origRemove = Storage.prototype.removeItem;
  var saveQueue = {};
  var saveTimer = null;

  function syncToServer() {
    var payload = Object.assign({}, saveQueue);
    saveQueue = {};
    if (!window.EMPRESA || !window.EMPRESA.id) return;
    fetch("{{ tv_config.urlDatos }}", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ tv_config.csrf }}"
      },
      body: JSON.stringify({ cambios: payload })
    }).catch(function(err){ console.warn("Error sincronizando módulo:", err); });
  }

  Storage.prototype.setItem = function(key, val) {
    origSet.call(this, key, val);
    if (key && key.indexOf(prefix) === 0) {
      var kSin = key.slice(prefix.length);
      saveQueue[kSin] = val;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(syncToServer, 600);
    }
  };

  Storage.prototype.removeItem = function(key) {
    origRemove.call(this, key);
    if (key && key.indexOf(prefix) === 0) {
      var kSin = key.slice(prefix.length);
      saveQueue[kSin] = null;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(syncToServer, 600);
    }
  };
})();
</script>

<body><header><h1>Ajuste inicial fiscal · Venezuela</h1><small>Actualización de activos y pasivos no monetarios · Registro de Activos Actualizados</small></header><nav id="nv"></nav><main id="v"></main>
<script>const KEY='aif1',EM=window.EMPRESA||{nombre:'',rif:'',condicion:''};
const $=s=>document.querySelector(s),N=v=>parseFloat(v)||0,R=v=>Math.round((v+Number.EPSILON)*100)/100,F=v=>R(v).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),FX=v=>v?R(v*10000)/10000:'';
const CATS=['Terrenos','Edificaciones','Maquinaria y equipo','Vehículos','Mobiliario y enseres','Inventarios','Cargos diferidos e intangibles','Inversiones en acciones','Otros no monetarios'];
const rowA=()=>({d:'',cat:'Maquinaria y equipo',fa:'',ci:0,da:0,ia:0}),rowP=()=>({d:'',m:0,ia:0});
const blank=()=>({cfg:{emp:EM.nombre,rif:EM.rif,cierre:'',inpc:0,tasa:3,elab:''},act:[rowA()],mon:{caja:0,cxc:0,otros:0},pas:[rowP()],pmon:{prov:0,otros:0}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.cfg)S=blank();S.cfg.emp=EM.nombre;S.cfg.rif=EM.rif;
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let tab='cfg';
const NV=[['cfg','Datos'],['act','Activos no monetarios'],['pas','Monetarios y pasivos'],['res','Resultado'],['asi','Asiento y registro'],['gui','Guía y normas']];
const fac=ia=>N(ia)>0&&N(S.cfg.inpc)>0?N(S.cfg.inpc)/N(ia):1;
function calc(){
 const A=S.act.map(r=>{const f=fac(r.ia),ok=N(r.ia)>0&&N(S.cfg.inpc)>0,nh=N(r.ci)-N(r.da),ca=R(N(r.ci)*f),da=R(N(r.da)*f),na=ca-da;return{r,f,ok,nh,ca,da,na,aj:R(na-nh)}});
 const P=S.pas.map(r=>{const f=fac(r.ia),ok=N(r.ia)>0&&N(S.cfg.inpc)>0,ma=R(N(r.m)*f);return{r,f,ok,ma,aj:R(ma-N(r.m))}});
 const aA=R(A.reduce((s,x)=>s+x.aj,0)),aP=R(P.reduce((s,x)=>s+x.aj,0)),neto=R(aA-aP);
 const mon=N(S.mon.caja)+N(S.mon.cxc)+N(S.mon.otros),pm=N(S.pmon.prov)+N(S.pmon.otros);
 const nh=A.reduce((s,x)=>s+x.nh,0),na=A.reduce((s,x)=>s+x.na,0),ph=P.reduce((s,x)=>s+N(x.r.m),0),pa=P.reduce((s,x)=>s+x.ma,0);
 return{A,P,aA,aP,neto,mon,pm,nh,na,ph,pa,patH:R(mon+nh-pm-ph),patF:R(mon+na-pm-pa),imp:R(Math.max(0,neto)*N(S.cfg.tasa)/100),falta:A.some(x=>!x.ok&&(N(x.r.ci)||N(x.r.da)))||P.some(x=>!x.ok&&N(x.r.m))}}
function C(k,v){S.cfg[k]=v;sv();draw()}
function A_(i,k,v){S.act[i][k]=v;sv();draw()}
function addA(){S.act.push(rowA());sv();draw()}
function delA(i){S.act.splice(i,1);if(!S.act.length)S.act.push(rowA());sv();draw()}
function P_(i,k,v){S.pas[i][k]=v;sv();draw()}
function addP(){S.pas.push(rowP());sv();draw()}
function delP(i){S.pas.splice(i,1);if(!S.pas.length)S.pas.push(rowP());sv();draw()}
function M(g,k,v){S[g][k]=N(v);sv();draw()}
const fl=(l,h)=>`<label>${l}${h}</label>`;
const warn=c=>c.falta?'<p><span class="tg wr">Hay partidas sin INPC de origen o sin INPC de cierre: se actualizan con factor 1,0000 hasta completarlos</span></p>':'';
const V={
cfg(){const c=S.cfg;return`<div class=card><h2>Datos del ajuste inicial</h2><div class=f>
${fl('Razón social',`<input value="${E(c.emp)}" readonly>`)}${fl('RIF',`<input value="${E(c.rif)}" readonly>`)}
${fl('Cierre del primer ejercicio gravable',`<input type=date value="${E(c.cierre)}" onchange="C('cierre',this.value)">`)}
${fl('INPC del mes de cierre',`<input type=number step=any value="${c.inpc||''}" onchange="C('inpc',N(this.value))">`)}
${fl('Impuesto sobre el ajuste inicial neto (%)',`<input type=number step=any value="${c.tasa}" onchange="C('tasa',N(this.value))">`)}
${fl('Elaborado por',`<input value="${E(c.elab)}" onchange="C('elab',this.value)">`)}</div>
<p class=mu style="margin:10px 0 0">El INPC (Índice Nacional de Precios al Consumidor, Área Metropolitana de Caracas) lo publica el Banco Central de Venezuela. Cargue los índices que corresponden a cada fecha.</p></div>
<div class=card><h2>Pasos</h2><ol><li>Registre en <b>Activos no monetarios</b> cada partida con su costo, depreciación acumulada e INPC del mes de adquisición.</li><li>En <b>Monetarios y pasivos</b> cargue los activos monetarios, los pasivos no monetarios y los pasivos monetarios.</li><li>Revise el <b>Resultado</b>: ajuste neto, impuesto y patrimonio fiscal actualizado.</li><li>Genere el <b>asiento</b> y el <b>Registro de Activos Actualizados</b>.</li></ol></div>`},
act(){const c=calc();let h=`<div class=card><h2>Activos no monetarios</h2>${warn(c)}<button class=b onclick="addA()">+ Agregar activo</button><div class=sc><table><tr><th>Descripción</th><th>Categoría</th><th>Adquisición</th><th>Costo histórico</th><th>Deprec. acumulada</th><th>INPC de adquisición</th><th class=n>Factor</th><th class=n>Costo actualizado</th><th class=n>Deprec. actualizada</th><th class=n>Valor neto actualizado</th><th class=n>Ajuste</th><th></th></tr>`;
 c.A.forEach((x,i)=>{const r=x.r;h+=`<tr><td><input value="${E(r.d)}" onchange="A_(${i},'d',this.value)"></td><td><select onchange="A_(${i},'cat',this.value)">${CATS.map(k=>`<option${k==r.cat?' selected':''}>${k}</option>`).join('')}</select></td><td><input type=month value="${E(r.fa)}" onchange="A_(${i},'fa',this.value)"></td><td><input type=number step=any value="${r.ci}" onchange="A_(${i},'ci',N(this.value))"></td><td><input type=number step=any value="${r.da}" onchange="A_(${i},'da',N(this.value))"></td><td><input type=number step=any value="${r.ia||''}" onchange="A_(${i},'ia',N(this.value))"></td><td class=n>${FX(x.f)||'1'}</td><td class=n>${F(x.ca)}</td><td class=n>${F(x.da)}</td><td class=n>${F(x.na)}</td><td class=n><b>${F(x.aj)}</b></td><td><button class="b x" onclick="delA(${i})">✕</button></td></tr>`});
 return h+`<tr class=tot><td colspan=3>Totales</td><td class=n>${F(S.act.reduce((s,r)=>s+N(r.ci),0))}</td><td class=n>${F(S.act.reduce((s,r)=>s+N(r.da),0))}</td><td colspan=3></td><td class=n>${F(c.A.reduce((s,x)=>s+x.da,0))}</td><td class=n>${F(c.na)}</td><td class=n>${F(c.aA)}</td><td></td></tr></table></div><p class=mu style="margin:8px 0 0">Costo y depreciación se actualizan con el mismo factor (INPC de cierre ÷ INPC de adquisición). Los terrenos y las inversiones no se deprecian.</p></div>`},
pas(){const c=calc(),m=(g,k,l)=>fl(l,`<input type=number step=any value="${S[g][k]}" onchange="M('${g}','${k}',this.value)">`);
 let h=`<div class=card><h2>Activos monetarios (no se actualizan)</h2><div class=f>${m('mon','caja','Caja y bancos')}${m('mon','cxc','Cuentas por cobrar')}${m('mon','otros','Otros activos monetarios')}</div></div>
<div class=card><h2>Pasivos monetarios (no se actualizan)</h2><div class=f>${m('pmon','prov','Proveedores y cuentas por pagar')}${m('pmon','otros','Otros pasivos monetarios')}</div></div>
<div class=card><h2>Pasivos no monetarios</h2>${warn(c)}<button class=b onclick="addP()">+ Agregar pasivo</button><div class=sc><table><tr><th>Descripción</th><th>Monto histórico</th><th>INPC de origen</th><th class=n>Factor</th><th class=n>Monto actualizado</th><th class=n>Ajuste</th><th></th></tr>`;
 c.P.forEach((x,i)=>{const r=x.r;h+=`<tr><td><input value="${E(r.d)}" onchange="P_(${i},'d',this.value)"></td><td><input type=number step=any value="${r.m}" onchange="P_(${i},'m',N(this.value))"></td><td><input type=number step=any value="${r.ia||''}" onchange="P_(${i},'ia',N(this.value))"></td><td class=n>${FX(x.f)||'1'}</td><td class=n>${F(x.ma)}</td><td class=n><b>${F(x.aj)}</b></td><td><button class="b x" onclick="delP(${i})">✕</button></td></tr>`});
 return h+`<tr class=tot><td>Totales</td><td class=n>${F(c.ph)}</td><td colspan=2></td><td class=n>${F(c.pa)}</td><td class=n>${F(c.aP)}</td><td></td></tr></table></div><p class=mu style="margin:8px 0 0">Ejemplos: anticipos de clientes e ingresos diferidos.</p></div>`},
res(){const c=calc(),ok=Math.abs(R(c.patF-c.patH-c.neto))<0.01;return`<div class=card><h2>Resultado del ajuste inicial</h2>${warn(c)}<div class="big" style="background:var(--g2);color:${c.neto>=0?'var(--g)':'var(--r)'}">Ajuste inicial neto: Bs ${F(c.neto)}</div>
